name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q docguard.py scripts tests
      - name: Validate documentation syntax and links
        working-directory: docs
        run: python ../docguard.py . --annotations --json ../docs-report.json
      - name: Preserve machine-readable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-syntax-report
          path: docs-report.json
          if-no-files-found: ignore
          retention-days: 7

  trusted-examples:
    name: Reviewed main-branch examples
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Execute reviewed quickstart examples
        working-directory: docs
        run: python ../docguard.py . --execute-trusted --annotations --json ../examples-report.json
      - name: Assert stale-output negative control fails
        shell: bash
        run: |
          set +e
          python docguard.py fixtures --execute-trusted --json negative-control.json
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json; r=json.load(open("negative-control.json")); assert r["failures"] == 1; assert r["results"][0]["status"] == "output_mismatch"'
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-example-reports
          path: |
            examples-report.json
            negative-control.json
          if-no-files-found: ignore
          retention-days: 7
